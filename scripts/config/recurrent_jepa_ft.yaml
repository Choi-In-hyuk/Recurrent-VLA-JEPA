run_id: recurrent_jepa_ft
run_root_dir: checkpoints
seed: 42
trackers: [json]
is_debug: false

framework:
  name: VLA_JEPA
  qwenvl:
    base_vlm: /media/choi/8AA890DCA890C859/vjepa2_baseline/checkpoints/Qwen3-VL-2B-Instruct
    attn_implementation: flash_attention_2
    vl_hidden_dim: 2048
  action_model:
    action_model_type: DiT-B
    action_hidden_dim: 1024
    hidden_size: 1024
    add_pos_embed: True
    max_seq_len: 1024
    action_dim: 7
    state_dim: 8
    future_action_window_size: 6
    action_horizon: 7
    past_action_window_size: 0
    repeated_diffusion_steps: 8
    noise_beta_alpha: 1.5
    noise_beta_beta: 1.0
    noise_s: 0.999
    num_timestep_buckets: 1000
    num_inference_timesteps: 4
    num_target_vision_tokens: 32
    diffusion_model_cfg:
      cross_attention_dim: 2048
      dropout: 0.2
      final_dropout: true
      interleave_self_attention: true
      norm_type: "ada_norm"
      num_layers: 16
      output_dim: 1024
      positional_embeddings: null
  vj2_model:
    base_encoder: /media/choi/8AA890DCA890C859/vjepa2_baseline/checkpoints/vitl-fpc64-256
    depth: 12
    num_heads: 8
    special_action_token: "<|action_{}|>"
    num_action_tokens_per_timestep: 8
    embodied_action_token: "<|embodied_action|>"
    num_embodied_action_tokens_per_instruction: 32
    num_frames: 8
  # Phase 2: Recurrent JEPA modules
  recurrent_jepa:
    enabled: true
    n_cond_tokens: 8      # 256 spatial tokens → 8 conditioning tokens for DiT
    use_cosine: true      # cosine similarity feature in gating module
  reduce_in_full_precision: true

datasets:
  vla_data:
    dataset_py: lerobot_datasets
    data_root_dir: /home/dataset-local/datasets/LeRobot/LEROBOT_LIBERO_DATA
    data_mix: libero_all
    action_type: delta_qpos
    CoT_prompt: "Your task is {instruction}. Infer the temporal dynamics from frames {actions} and produce the corresponding policy actions {e_actions}."
    resolution_size: 224
    video_resolution_size: 256
    per_device_batch_size: 16
    load_all_data_for_training: true
    with_state: true

trainer:
  epochs: 100
  max_train_steps: 20000
  num_warmup_steps: 500
  save_interval: 5000
  eval_interval: 100
  learning_rate:
    base: 1.0e-05
    action_model: 1.0e-04   # DiT fine-tune
    fusion: 1.0e-04          # LearnedGatingFusion (train from scratch)
    vj_to_dit: 1.0e-04       # VJtoDiTProjection (train from scratch)
  lr_scheduler_type: cosine_with_min_lr
  scheduler_specific_kwargs:
    min_lr: 1.0e-06
  # Freeze everything except fusion, vj_to_dit, action_model
  freeze_modules: "qwen_vl_interface,vj_encoder,vj_predictor"
  # Load base checkpoint — fusion + vj_to_dit will be randomly initialised
  pretrained_checkpoint: /media/choi/8AA890DCA890C859/vjepa2_baseline/checkpoints/VLA-JEPA/LIBERO/checkpoints/VLA-JEPA-LIBERO.pt
  reload_modules: "vj_encoder,vj_predictor,qwen_vl_interface,action_model,vj_processor"
  loss_scale:
    vla: 1.0
  max_grad_norm: 1.0
  warmup_ratio: 0.025
  weight_decay: 0.0
  logging_frequency: 10
  gradient_clipping: 1.0
  gradient_accumulation_steps: 1
  is_resume: false
  resume_epoch: null
  resume_step: null
  enable_gradient_checkpointing: true
  enable_mixed_precision_training: true
  optimizer:
    name: AdamW
    betas: [0.9, 0.95]
    eps: 1.0e-08
    weight_decay: 1.0e-08
